<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AGIS Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #1d4ed8 0%, transparent 35%),
                radial-gradient(circle at bottom right, #0ea5e9 0%, transparent 30%),
                #08111f;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 15px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.35);
        }

        .brand h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .brand p {
            color: #94a3b8;
            font-size: 13px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .login-card h2 {
            color: #0f172a;
            font-size: 23px;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .security-note {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            color: #64748b;
            font-size: 11px;
            line-height: 1.6;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #93c5fd;
            text-decoration: none;
            font-size: 12px;
        }

        .back-link:hover {
            color: white;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="brand">

            <div class="brand-logo">
                A
            </div>

            <h1>AGIS</h1>

            <p>
                Aman Global International Services
            </p>

        </div>


        <div class="login-card">

            <h2>Admin Login</h2>

            <p class="subtitle">
                Sign in to access the AGIS management system.
            </p>


            <div
                id="message"
                class="message"
            ></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>


            <div class="security-note">

                🔒 Secure authentication powered by Supabase

                <br>

                Authorized administrators only.

            </div>

        </div>


        <a
            href="../index.html"
            class="back-link"
        >
            ← Back to AGIS Website
        </a>

    </div>


    <script>

        const SUPABASE_URL =
            "https://oqazlpipfjsrptfpxdtu.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_Njj9rLGD-r9MRmGkVq8wrg_ZP2hb7Oi";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                loginButton.disabled = true;

                loginButton.textContent =
                    "Signing In...";


                message.className =
                    "message";


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showMessage(
                        "Login failed. Please check your email and password.",
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Sign In";

                    return;
                }


                if (data.session) {

                    showMessage(
                        "Login successful. Opening Admin Dashboard...",
                        "success"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "./index.html";

                        },
                        800
                    );

                }

            }
        );

    </script>

</body>
</html>
